name: Release candidates
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - name: Validate exact tag and first-parent version increase
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-tag.mjs "$RELEASE_TAG"
  quality:
    needs: release-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install pinned tools
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Independently check the complete tagged tree and its messages, then quality
        env:
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          npm run check:ci -- --initial "$head"
  package-candidates:
    needs: [quality, release-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Enforce Apple Silicon host
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm install --global npm@11.6.2
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - run: npm ci
      - name: Check archive tool availability
        run: tar --version
      - name: Build unsigned installer candidates for human qualification
        run: npm run tauri -- build --ci --no-sign -- --locked
      - name: Prepare default binstall archive candidate, without installation or publication
        env:
          ARCHIVE_TARGET: ${{ matrix.target }}
        shell: bash
        run: node scripts/archive.mjs "$ARCHIVE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-candidates-${{ matrix.target }}
          path: |
            src-tauri/target/binstall/*.tgz
            src-tauri/target/binstall/*.sha256
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
