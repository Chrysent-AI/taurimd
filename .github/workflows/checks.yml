name: Checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install pinned tools
        run: |
          npm install --global npm@11.6.2
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Independently check introduced diffs and complete messages, then quality
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" "$head")
            npm run check:ci -- --base "$base" --head "$head"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            npm run check:ci -- --base "$PUSH_BEFORE" --head "$head"
          else
            npm run check:ci -- --initial "$head"
          fi
  browsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm install --global npm@11.6.2 && npm ci
      - run: npm run browsers:install -- --with-deps
      - name: Install private browser audio prerequisite
        run: |
          set -euo pipefail
          sudo apt-get update
          node scripts/ci-browser-audio.mjs --check-packages
          sudo apt-get install -y --no-install-recommends --no-remove pulseaudio pulseaudio-utils
          dpkg-query --show --showformat='${Package} ${Version}\n' pulseaudio pulseaudio-utils libpulse0
          for package in pulseaudio pulseaudio-utils libpulse0; do
            version=$(dpkg-query --show --showformat='${Version}' "$package")
            [[ "$version" =~ ^1:16\.1\+dfsg1-2ubuntu10(\.[0-9]+)?$ ]] || exit 1
          done
      - run: node scripts/ci-browser-audio.mjs
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
  native-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Enforce Apple Silicon host
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm install --global npm@11.6.2
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - run: npm ci
      - run: npm run build
      - name: Rust quality on additional native targets
        if: runner.os != 'Linux'
        run: npm run check:rust
      - name: Build unsigned host-native installer candidates
        run: npm run tauri -- build --ci --no-sign -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-native-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
