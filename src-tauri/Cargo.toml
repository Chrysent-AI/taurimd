[package]
name = "mdviewerrsx"
version = "0.1.0"
description = "A read-only local document reader"
authors = ["Chrysent"]
license = "MIT"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "mdviewerrsx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
zip = { version = "=9.0.1", default-features = false }
same-file = "=1.0.6"
notify = "=8.2.0"

# Keep host build/proc-macro metadata intact; the application remains optimized.
[profile.release.build-override]
strip = "none"
