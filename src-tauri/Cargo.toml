[package]
name = "taurimd"
version = "0.1.0"
description = "A read-only, cross-platform Markdown viewer GUI built with Tauri for Windows, macOS, and Linux."
authors = ["Chrysent"]
license = "MIT"
edition = "2024"
rust-version = "1.97.1"

readme = "package/README.md"
keywords = ["markdown", "viewer", "tauri", "gui", "cross-platform"]
categories = ["gui", "text-processing", "visualization"]
include = [
  "Cargo.toml", "Cargo.lock", "build.rs", "src/**/*.rs",
  "tauri*.conf.json", "capabilities/reader.json", "icons/icon.png", "icons/icon.ico",
  "packaging/associations.nsh", "packaging/taurimd.desktop", "packaging/taurimd.xml",
  "frontend-dist/**", "package/README.md", "package/LICENSE", "package/DEPENDENCIES.md", "package/THIRD_PARTY_NOTICES.md",
  "permissions/autogenerated/**", "gen/schemas/*.json",
]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "taurimd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
zip = { version = "=9.0.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "http2"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", default-features = false, features = ["sync", "time"] }
quick-xml = { version = "=0.42.0", default-features = false }
same-file = "=1.0.6"
notify = "=8.2.0"

# Keep host build/proc-macro metadata intact; the application remains optimized.
[profile.release.build-override]
strip = "none"
