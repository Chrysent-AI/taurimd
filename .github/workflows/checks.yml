name: Checks
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    # GitHub expressions have no regex match operator, so the commit gate is
    # a startsWith over each accepted conventional-commit prefix, with and
    # without a scope.
    if: >-
      ${{ github.event_name == 'pull_request' ||
      startsWith(github.event.head_commit.message, 'feat:') ||
      startsWith(github.event.head_commit.message, 'feat(') ||
      startsWith(github.event.head_commit.message, 'fix:') ||
      startsWith(github.event.head_commit.message, 'fix(') ||
      startsWith(github.event.head_commit.message, 'test:') ||
      startsWith(github.event.head_commit.message, 'test(') ||
      startsWith(github.event.head_commit.message, 'tests:') ||
      startsWith(github.event.head_commit.message, 'tests(') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
          package-manager-cache: false
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install pinned tools
        run: |
          npm install --global npm@12.2.1
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Independently check introduced diffs and complete messages, then quality
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" "$head")
            npm run check:ci -- --base "$base" --head "$head"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            npm run check:ci -- --base "$PUSH_BEFORE" --head "$head"
          else
            npm run check:ci -- --initial "$head"
          fi
  browsers:
    if: >-
      ${{ github.event_name == 'pull_request' ||
      startsWith(github.event.head_commit.message, 'feat:') ||
      startsWith(github.event.head_commit.message, 'feat(') ||
      startsWith(github.event.head_commit.message, 'fix:') ||
      startsWith(github.event.head_commit.message, 'fix(') ||
      startsWith(github.event.head_commit.message, 'test:') ||
      startsWith(github.event.head_commit.message, 'test(') ||
      startsWith(github.event.head_commit.message, 'tests:') ||
      startsWith(github.event.head_commit.message, 'tests(') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 && npm ci
      - run: npm run browsers:install -- --with-deps
      - name: Install private browser audio prerequisite
        run: |
          set -euo pipefail
          sudo apt-get update
          node scripts/ci-browser-audio.mjs --check-packages
          sudo apt-get install -y --no-install-recommends --no-remove pulseaudio pulseaudio-utils
          dpkg-query --show --showformat='${Package} ${Version}\n' pulseaudio pulseaudio-utils libpulse0
          for package in pulseaudio pulseaudio-utils libpulse0; do
            version=$(dpkg-query --show --showformat='${Version}' "$package")
            [[ "$version" =~ ^1:16\.1\+dfsg1-2ubuntu10(\.[0-9]+)?$ ]] || exit 1
          done
      - run: node scripts/ci-browser-audio.mjs
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
  native-build:
    if: >-
      ${{ github.event_name == 'pull_request' ||
      startsWith(github.event.head_commit.message, 'feat:') ||
      startsWith(github.event.head_commit.message, 'feat(') ||
      startsWith(github.event.head_commit.message, 'fix:') ||
      startsWith(github.event.head_commit.message, 'fix(') ||
      startsWith(github.event.head_commit.message, 'test:') ||
      startsWith(github.event.head_commit.message, 'test(') ||
      startsWith(github.event.head_commit.message, 'tests:') ||
      startsWith(github.event.head_commit.message, 'tests(') }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
          package-manager-cache: false
      - name: Enforce Apple Silicon host
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm install --global npm@12.2.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.1
      - run: npm ci
      - run: npm run build
      - name: Rust quality on additional native targets
        if: runner.os != 'Linux'
        run: npm run check:rust
      - name: Compile unsigned debug host-native app without installers
        run: npm run tauri -- build --debug --no-bundle --ci --no-sign -- --locked
