name: Release candidates
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
      - name: Validate exact tag and first-parent version increase
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-tag.mjs "$RELEASE_TAG"
  package-candidates:
    needs: [release-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
          package-manager-cache: false
      - name: Enforce Apple Silicon host
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm install --global npm@12.2.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.1
      - run: npm ci
      - name: Check archive tool availability
        run: tar --version
      - name: Build unsigned installer candidates for human qualification
        run: npm run tauri -- build --ci --no-sign -- --locked
      - name: Prepare default binstall archive candidate, without installation or publication
        env:
          ARCHIVE_TARGET: ${{ matrix.target }}
        shell: bash
        run: node scripts/archive.mjs "$ARCHIVE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-candidates-${{ matrix.target }}
          path: |
            src-tauri/target/binstall/*.tgz
            src-tauri/target/binstall/*.sha256
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
